plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jalal.expensemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jalal.expensemanager'
        minSdk 23
        targetSdk 33
        versionCode 2
        versionName '1.0.1'
    }

    // Sign the sideloadable APK with the legacy v1 scheme as well as
    // modern v2/v3 schemes for compatibility with Android/OEM installers.
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
